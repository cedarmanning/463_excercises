<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 02 - Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body class="bg-light">
    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <div class="card shadow-sm p-4">
            <h1 class="text-center m-4 fs-2">Roth IRA Calculator</h1>

            <form>
              <div class="row mb-3">
                <label for="balance" class="col-6 col-form-label">Balance ($)</label>
                <div class="col-6">
                  <input type="text" class="form-control" id="balance"/>
                </div>
              </div>

              <div class="row mb-3">
                <label for="contribution" class="col-6 col-form-label">Annual Contribution ($)</label>
                <div class="col-6">
                  <input type="text" class="form-control" id="contribution"/>
                </div>
              </div>

              <div class="row mb-3">
                <span class="col-6 col-form-label">Maximize contributions?</span>
                <div class="col-6">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="max" id="yes" />
                    <label class="form-check-label" for="yes">Yes</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="max" id="no" />
                    <label class="form-check-label" for="no">No</label>
                  </div>
                </div>
              </div>

              <div class="row mb-3">
                <label for="expectedReturn" class="col-6 col-form-label">Expected return (%)</label>
                <div class="col-6">
                  <input type="number" class="form-control" id="expectedReturn"/>
                </div>
              </div>

              <div class="row mb-3">
                <label for="currentAge" class="col-6 col-form-label">Current age</label>
                <div class="col-6">
                  <input type="number" class="form-control" id="currentAge"/>
                </div>
              </div>

              <div class="row mb-3">
                <label for="retirementAge" class="col-6 col-form-label">Retirement age</label>
                <div class="col-6">
                  <input type="number" class="form-control" id="retirementAge"/>
                </div>
              </div>

              <div class="row mb-4">
                <label for="taxRate" class="col-6 col-form-label">Tax rate (%)</label>
                <div class="col-6">
                  <input type="number" class="form-control" id="taxRate"/>
                </div>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-6">
                  <button type="submit" class="btn btn-primary w-100">Calculate</button>
                </div>
                <div class="col-6">
                  <button type="reset" class="btn btn-outline-secondary w-100">Reset</button>
                </div>
              </div>
            </form>

            <p class="text-muted mb-0">
              This exercise is a simplified version of the Roth IRA Calculator
              <a href="https://www.calculator.net">Calculator.net</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
